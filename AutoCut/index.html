<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>AutoCut</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="titlebar">
      <div>
        <h1>AutoCut</h1>
        <span class="sub" data-i18n="app.sub"></span>
      </div>
      <select id="lang" class="langsel" aria-label="Idioma / Language">
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
    </div>
  </header>

  <section>
    <button id="btnRead" class="primary" data-i18n="btn.read"></button>
    <div id="seqName" class="muted"></div>
  </section>

  <section id="secSpeakers" class="hidden">
    <h2 data-i18n="people.title"></h2>
    <label class="row"><span data-i18n="people.recording"></span>
      <select id="mode">
        <option value="mouth" data-i18n="mode.mouth"></option>
        <option value="mics" data-i18n="mode.mics"></option>
      </select>
    </label>
    <label class="row hidden" id="rowAudio"><span data-i18n="people.audio"></span>
      <span><select id="selAudio"></select> <select id="selAudioCh">
        <option value="mix" data-i18n="ch.mix"></option>
        <option value="L" data-i18n="ch.L"></option>
        <option value="R" data-i18n="ch.R"></option>
      </select></span>
    </label>
    <p class="hint" id="hintMode"></p>
    <table id="tblSpeakers">
      <thead></thead>
      <tbody></tbody>
    </table>
    <label class="row"><span data-i18n="people.wide"></span>
      <select id="selWide"></select>
    </label>
  </section>

  <section id="secSettings" class="hidden">
    <h2 data-i18n="settings.title"></h2>
    <label class="row"><span data-i18n="set.sens"></span> <span id="vSens"></span>
      <input type="range" id="sens" min="0" max="100" value="50">
    </label>
    <label class="row"><span data-i18n="set.minShot"></span>
      <input type="number" id="minShot" min="0.5" max="20" step="0.1" value="2.5">
    </label>
    <label class="row"><span data-i18n="set.preRoll"></span>
      <input type="number" id="preRoll" min="0" max="2" step="0.05" value="0.25">
    </label>
    <label class="row check"><input type="checkbox" id="wideOverlap" checked> <span data-i18n="set.wideOverlap"></span></label>
    <label class="row indent"><span data-i18n="set.overlapMin"></span>
      <input type="number" id="overlapMin" min="0.3" max="10" step="0.1" value="1.5">
    </label>
    <h2 class="sub2" data-i18n="maxair.title"></h2>
    <p class="hint" data-i18n="maxair.hint"></p>
    <table id="tblMax">
      <thead><tr>
        <th data-i18n="maxair.th.cam"></th>
        <th data-i18n="maxair.th.max"></th>
        <th data-i18n="maxair.th.to"></th>
        <th data-i18n="maxair.th.len"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <details>
      <summary data-i18n="adv.title"></summary>
      <label class="row"><span data-i18n="adv.switchSec"></span>
        <input type="number" id="switchSec" min="0.1" max="3" step="0.05" value="0.4">
      </label>
      <label class="row"><span data-i18n="adv.overlapDb"></span>
        <input type="number" id="overlapDb" min="1" max="20" step="0.5" value="6">
      </label>
      <label class="row"><span data-i18n="adv.mouthFps"></span>
        <input type="number" id="mouthFps" min="4" max="30" step="1" value="10">
      </label>
      <label class="row"><span data-i18n="adv.syncWeight"></span> <small data-i18n="adv.syncOff"></small>
        <input type="number" id="syncWeight" min="0" max="1" step="0.05" value="0.7">
      </label>
      <label class="row"><span data-i18n="adv.mouthMin"></span>
        <input type="number" id="mouthMin" min="0.05" max="1" step="0.05" value="0.35">
      </label>
      <label class="row"><span data-i18n="adv.mouthOverlap"></span>
        <input type="number" id="mouthOverlap" min="0.3" max="1" step="0.05" value="0.6">
      </label>
      <label class="row"><span data-i18n="adv.ffmpeg"></span>
        <input type="text" id="ffmpegPath" data-i18n-ph="adv.ffmpegAuto">
      </label>
    </details>
  </section>

  <section id="secRun" class="hidden">
    <button id="btnAnalyze" class="primary" data-i18n="btn.analyze"></button>
    <div id="progress" class="muted"></div>
    <canvas id="preview" width="360" height="90"></canvas>
    <div id="legend"></div>
    <div id="stats" class="muted"></div>
  </section>

  <section id="secApply" class="hidden">
    <label class="row check"><input type="checkbox" id="clone" checked> <span data-i18n="apply.clone"></span></label>
    <label class="row check"><input type="checkbox" id="markDoubts" checked> <span data-i18n="apply.mark"></span></label>
    <button id="btnApply" class="primary" data-i18n="btn.apply"></button>
    <div id="applyMsg"></div>
  </section>

  <div id="error" class="error hidden"></div>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
